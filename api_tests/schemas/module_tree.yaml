# /module/tree 接口响应体结构
type: object
required: [data]
properties:
  data:
    type: array
    title: 模块树顶层（根节点列表）
    # 顶层
    items:
      $ref: '#/components/schemas/RootModule'

components:
  schemas:
    # 根节点：没有 parent_id
    RootModule:
      type: object
      required:
        - module_id
        - name
        - sort_num
      # 禁止出现 parent_id
      forbidden:
        - parent_id
      properties:
        module_id:
          type: integer
          minimum: 1
        name:
          type: string
        description:
          type: string
        sort_num:
          type: integer
          minimum: 0
        children:
          type: array
          minItems: 1
          items:
            # 子节点：非根节点
            $ref: '#/components/schemas/ChildModule'
        functions:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Function'

    # 非根节点：必须有 parent_id
    ChildModule:
      type: object
      required:
        - module_id
        - name
        - parent_id
        - sort_num
      properties:
        module_id:
          type: integer
          minimum: 1
        name:
          type: string
        description:
          type: string
        parent_id:
          type: integer
          minimum: 1
        sort_num:
          type: integer
          minimum: 0
        children:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ChildModule'
        functions:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Function'
    Function:
      type: object
      required:
        - function_id
        - name
        - code
        - sort_num
        - module_id
      properties:
        function_id:
          type: integer
          minimum: 1
        name:
          type: string
        code:
          type: string
        description:
          type: string
        sort_num:
          type: integer
          minimum: 0
        module_id:
          type: integer
          minimum: 1

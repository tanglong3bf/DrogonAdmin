# /dept/tree 接口响应体结构
response:
  type: object
  required: [data]
  properties:
    data:
      type: array
      title: 部门树顶层（根节点列表）
      # 顶层
      items:
        $ref: '#/definitions/RootDepartment'

definitions:
  # 根节点：没有 parent_id
  RootDepartment:
    type: object
    required:
      - dept_id
      - name
      - sort_num
    # 禁止出现 parent_id
    forbidden:
      - parent_id
    properties:
      dept_id:
        type: integer
        minimum: 1
      name:
        type: string
      sort_num:
        type: integer
        minimum: 0
      children:
        type: array
        minItems: 1
        items:
          # 子节点：非根节点
          $ref: '#/definitions/ChildDepartment'

  # 非根节点：必须有 parent_id
  ChildDepartment:
    type: object
    required:
      - dept_id
      - name
      - parent_id
      - sort_num
    properties:
      dept_id:
        type: integer
        minimum: 1
      name:
        type: string
      parent_id:
        type: integer
        minimum: 1
      sort_num:
        type: integer
        minimum: 0
      children:
        type: array
        minItems: 1
        items:
          $ref: '#/definitions/ChildDepartment'

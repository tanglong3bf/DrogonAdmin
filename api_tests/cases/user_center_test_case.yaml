user_center_cases:
  # 修改基础信息 {{{
  - name: 修改基础信息-过长的昵称
    sql_file: user_center_update_basic.sql
    url: http://localhost:8000/user_center/basic_info
    method: PATCH
    json:
      nickname: abcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxy
    params: ''
    expect:
      status_code: 400
      assert_jsonpath:
        $.code: lt 0
        $.error: nickname参数长度过长
  - name: 修改基础信息-性别为-1
    url: http://localhost:8000/user_center/basic_info
    method: PATCH
    json:
      sex: -1
    params: ''
    expect:
      status_code: 400
      assert_jsonpath:
        $.code: lt 0
        $.error: sex的值超出期望范围
  - name: 修改基础信息-性别为3
    url: http://localhost:8000/user_center/basic_info
    method: PATCH
    json:
      sex: -1
    params: ''
    expect:
      status_code: 400
      assert_jsonpath:
        $.code: lt 0
        $.error: sex的值超出期望范围
  - name: 修改基础信息-修改手机号（10位）
    url: http://localhost:8000/user_center/basic_info
    method: PATCH
    json:
      phone_number: '1381234567'
    params: ''
    expect:
      status_code: 400
      assert_jsonpath:
        $.code: lt 0
        $.error: phone_number参数长度过短
  - name: 修改基础信息-修改手机号（12位）
    url: http://localhost:8000/user_center/basic_info
    method: PATCH
    json:
      phone_number: '138123456789'
    params: ''
    expect:
      status_code: 400
      assert_jsonpath:
        $.code: lt 0
        $.error: phone_number参数长度过长
  - name: 修改基础信息-修改手机号（11位+包含字母）
    url: http://localhost:8000/user_center/basic_info
    method: PATCH
    json:
      phone_number: '1381234567a'
    params: ''
    expect:
      status_code: 400
      assert_jsonpath:
        $.code: lt 0
        $.error: 手机号只支持数字
  - name: 修改基础信息-修改邮箱（缺少@）
    url: http://localhost:8000/user_center/basic_info
    method: PATCH
    json:
      email: abcqq.com
    params: ''
    expect:
      status_code: 400
      assert_jsonpath:
        $.code: lt 0
        $.error: 邮箱格式错误
  - name: 修改基础信息-修改邮箱（缺少.）
    url: http://localhost:8000/user_center/basic_info
    method: PATCH
    json:
      email: abc@qq
    params: ''
    expect:
      status_code: 400
      assert_jsonpath:
        $.code: lt 0
        $.error: 邮箱格式错误
  - name: 数据检查-更新失败
    url: http://localhost:8000/user
    method: GET
    json: {}
    params: ''
    expect:
      status_code: 200
      assert_jsonpath:
        $.data.list[0].nickname: 超级管理员
    validate_schema: user_paginated.yaml
  - name: 修改基础信息-修改昵称
    url: http://localhost:8000/user_center/basic_info
    method: PATCH
    json:
      nickname: 修改后的昵称
    params: ''
    expect:
      status_code: 204
  - name: 修改基础信息-修改性别为1
    url: http://localhost:8000/user_center/basic_info
    method: PATCH
    json:
      sex: 1
    params: ''
    expect:
      status_code: 204
  - name: 修改基础信息-修改手机号
    url: http://localhost:8000/user_center/basic_info
    method: PATCH
    json:
      phone_number: '13811223344'
    params: ''
    expect:
      status_code: 204
  - name: 修改基础信息-修改邮箱
    url: http://localhost:8000/user_center/basic_info
    method: PATCH
    json:
      email: hello@world.com
    params: ''
    expect:
      status_code: 204
  - name: 数据检查-更新成功
    url: http://localhost:8000/user
    method: GET
    json: {}
    params: ''
    expect:
      status_code: 200
      assert_jsonpath:
        $.data.list[0].nickname: 修改后的昵称
        $.data.list[0].sex: 1
        $.data.list[0].phone_number: '13811223344'
        $.data.list[0].email: hello@world.com
    validate_schema: user_paginated.yaml
  # }}}
  # 修改密码 {{{
  - name: 登录接口-为修改密码做准备
    url: http://localhost:8000/login
    method: POST
    need_token: False
    json:
      username: admin123
      password: '123456'
    params: ''
    expect:
      status_code: 200
      assert_jsonpath:
        $.data.user_info.user_id: 1
    validate_schema: login_response.yaml
    extract:
      token: $.data.token
  - name: 修改密码-缺少旧密码
    url: http://localhost:8000/user_center/change_password
    method: PATCH
    json:
      new_password: '654321'
    params: ''
    expect:
      status_code: 400
      assert_jsonpath:
        $.code: lt 0
        $.error: 缺少必备参数：old_password
  - name: 修改密码-缺少新密码
    url: http://localhost:8000/user_center/change_password
    method: PATCH
    json:
      old_password: '123456'
    params: ''
    expect:
      status_code: 400
      assert_jsonpath:
        $.code: lt 0
        $.error: 缺少必备参数：new_password
  - name: 修改密码-新旧密码相同
    url: http://localhost:8000/user_center/change_password
    method: PATCH
    json:
      old_password: '123456'
      new_password: '123456'
    params: ''
    expect:
      status_code: 400
      assert_jsonpath:
        $.code: lt 0
        $.error: 新旧密码不能相同
  - name: 修改密码-正常修改
    url: http://localhost:8000/user_center/change_password
    method: PATCH
    json:
      old_password: '123456'
      new_password: '654321'
    params: ''
    expect:
      status_code: 204
  - name: 登录接口-用新密码登录
    url: http://localhost:8000/login
    method: POST
    need_token: False
    json:
      username: admin123
      password: '654321'
    params: ''
    expect:
      status_code: 200
      assert_jsonpath:
        $.data.user_info.user_id: 1
    validate_schema: login_response.yaml
    extract:
      token: $.data.token
  #}}}

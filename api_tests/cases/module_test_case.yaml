module_cases:
  # 查询模块树 {{{
  - name: 查询模块树-没有模块
    sql_file: empty_module_tree.sql
    url: http://localhost:8000/module/tree
    method: GET
    json: {}
    params: ''
    expect:
      status_code: 200
      assert_jsonpath:
        $.data: []
    validate_schema: module_tree.yaml
  - name: 查询模块树-正常查询
    sql_file: normal_module_tree.sql
    url: http://localhost:8000/module/tree
    method: GET
    json: {}
    params: ''
    expect:
      status_code: 200
      assert_jsonpath:
        len:$.data: 1
        $.data[0].name: 系统管理
        $.data[0].children[0].name: 组织架构
        $.data[0].children[0].children[0].name: 部门管理
        $.data[0].children[0].children[1].name: 用户管理
        $.data[0].children[1].name: 权限管理
        $.data[0].children[1].children[0].name: 角色管理
        $.data[0].children[1].children[1].name: 权限分配
    validate_schema: module_tree.yaml
  - name: 查询模块树-多个根节点
    sql_file: multi_root_module_tree.sql
    url: http://localhost:8000/module/tree
    method: GET
    json: {}
    params: ''
    expect:
      status_code: 200
      assert_jsonpath:
        len:$.data: 3
        len:$.data[0].children: 2
        len:$.data[1].children: 1
        len:$.data[2].children: 1
    validate_schema: module_tree.yaml
  - name: 查询模块树-软删除数据不应被展示
    sql_file: have_deleted_data_module_tree.sql
    url: http://localhost:8000/module/tree
    method: GET
    json: {}
    params: ''
    expect:
      status_code: 200
      assert_jsonpath:
        len:$.data[0].children: 2 # 三个数据，软删除一个
    validate_schema: module_tree.yaml
  - name: 查询模块树-有关联的功能
    sql_file: module_tree_with_action.sql
    url: http://localhost:8000/module/tree
    method: GET
    json: {}
    params: ''
    expect:
      status_code: 200
      assert_jsonpath:
        len:$.data[0].children[0].children[0].actions: 6
        len:$.data[0].children[0].children[1].actions: 5
        len:$.data[0].children[1].children[0].actions: 5
        len:$.data[0].children[0].children[0].priorities: 4
        len:$.data[0].children[0].children[1].priorities: 4
        len:$.data[0].children[1].children[0].priorities: 4
    validate_schema: module_tree.yaml
  # }}}
  # 删除模块 {{{
  - name: 删除模块-不存在的数据
    sql_file: module_to_delete.sql
    url: http://localhost:8000/module/233
    method: DELETE
    json: {}
    params: ''
    expect:
      status_code: 204
  - name: 删除模块-软删除的数据
    url: http://localhost:8000/module/1
    method: DELETE
    json: {}
    params: ''
    expect:
      status_code: 204
  - name: 删除模块-有子模块的模块
    url: http://localhost:8000/module/2
    method: DELETE
    json: {}
    params: ''
    expect:
      status_code: 400
      assert_jsonpath:
        $.code: lt 0
        $.error: 指定模块包含子模块
  - name: 删除模块-有功能的模块(功能均未被使用)
    url: http://localhost:8000/module/4
    method: DELETE
    json: {}
    params: ''
    expect:
      status_code: 204
  - name: 删除模块-功能被分配了权限
    url: http://localhost:8000/module/5
    method: DELETE
    json: {}
    params: ''
    expect:
      status_code: 400
      assert_jsonpath:
        $.code: lt 0
        $.error: 功能已被使用
  - name: 删除模块-功能被菜单使用
    url: http://localhost:8000/module/6
    method: DELETE
    json: {}
    params: ''
    expect:
      status_code: 400
      assert_jsonpath:
        $.code: lt 0
        $.error: 功能已被使用
  # }}}
  # 新增模块 {{{
  - name: 新增模块-正常新增
    sql_file: module_to_create.sql
    url: http://localhost:8000/module
    method: POST
    json:
      name: 模块-1
    params: ''
    expect:
      status_code: 201
  - name: 新增模块-设置描述
    url: http://localhost:8000/module
    method: POST
    json:
      name: 模块-2
      description: 模块-2的描述
    params: ''
    expect:
      status_code: 201
  - name: 新增模块-设置父模块
    url: http://localhost:8000/module
    method: POST
    json:
      name: 模块-1-1
      parent_id: 1
    params: ''
    expect:
      status_code: 201
  - name: 新增模块-不同父部门的name可重复
    url: http://localhost:8000/module
    method: POST
    json:
      name: 模块-1
      parent_id: 2
    params: ''
    expect:
      status_code: 201
  - name: 新增模块-name冲突
    url: http://localhost:8000/module
    method: POST
    json:
      name: 模块-1
    params: ''
    expect:
      status_code: 400
      assert_jsonpath:
        $.code: lt 0
        $.error: 模块名称冲突
  - name: 新增模块-父模块不存在
    url: http://localhost:8000/module
    method: POST
    json:
      name: 模块-233
      parent_id: 233
    params: ''
    expect:
      status_code: 400
      assert_jsonpath:
        $.code: lt 0
        $.error: 指定的模块id不存在
  - name: 新增模块-数据检查
    url: http://localhost:8000/module/tree
    method: GET
    json: {}
    params: ''
    expect:
      status_code: 200
      assert_jsonpath:
        len:$.data: 4 # 2个自带2个新增
        $.data[1].children[0].name: 模块-1 # 与下一条不平级，可有重复的名称
        $.data[2].name: 模块-1 # 新增的
        $.data[3].name: 模块-2 # 新增的
  # }}}
  # 更新模块 {{{
  - name: 更新模块-未传递参数
    sql_file: module_to_update.sql
    url: http://localhost:8000/module/1
    method: PATCH
    json: {}
    params: ''
    expect:
      status_code: 400
      assert_jsonpath:
        $.code: lt 0
        $.error: 请至少指定一个需要更新的字段
  - name: 更新模块-只修改name且与旧值相同
    url: http://localhost:8000/module/1
    method: PATCH
    json:
      name: 模块-1
    params: ''
    expect:
      status_code: 204
  - name: 更新模块-只修改name
    url: http://localhost:8000/module/1
    method: PATCH
    json:
      name: 新名称
    params: ''
    expect:
      status_code: 204
  - name: 更新模块-数据检查-1
    url: http://localhost:8000/module/tree
    method: GET
    json: {}
    params: ''
    expect:
      status_code: 200
      assert_jsonpath:
        $.data[0].name: 新名称
        $.data[0].description: 未修改的描述
  - name: 更新模块-清空描述
    url: http://localhost:8000/module/1
    method: PATCH
    json:
      description: null
    params: ''
    expect:
      status_code: 204
  - name: 更新模块-数据检查-2
    url: http://localhost:8000/module/tree
    method: GET
    json: {}
    params: ''
    expect:
      status_code: 200
      assert_jsonpath:
        $.data[0].name: 新名称
        len:$.data[0].description: 0
  # }}}
  # 排序模块 {{{
  - name: 排序模块-正常排序
    sql_file: module_to_sort.sql
    url: http://localhost:8000/module/sort
    method: POST
    json:
      parent_id: 1
      module_ids: [3, 2, 4]
    params: ''
    expect:
      status_code: 204
  - name: 排序模块-检查排序结果
    url: http://localhost:8000/module/tree
    method: GET
    json: {}
    params: ''
    expect:
      status_code: 200
      assert_jsonpath:
        len:$.data: 2
        $.data[0].children[0].name: 模块-1-2
        $.data[0].children[1].name: 模块-1-1
        $.data[0].children[2].name: 模块-1-3
  - name: 排序模块-排序根模块
    url: http://localhost:8000/module/sort
    method: POST
    json:
      module_ids: [5, 1]
    params: ''
    expect:
      status_code: 204
  - name: 排序模块-检查排序结果2
    url: http://localhost:8000/module/tree
    method: GET
    json: {}
    params: ''
    expect:
      status_code: 200
      assert_jsonpath:
        len:$.data: 2
        $.data[0].name: 模块-2
        $.data[1].name: 模块-1
  - name: 排序模块-指定部分子模块id
    url: http://localhost:8000/module/sort
    method: POST
    json:
      parent_id: 1
      module_ids: [4, 2] # 不全
    params: ''
    expect:
      status_code: 204
  - name: 排序模块-检查排序结果3
    url: http://localhost:8000/module/tree
    method: GET
    json: {}
    params: ''
    expect:
      status_code: 200
      assert_jsonpath:
        len:$.data: 2
        # 公司被排序过
        $.data[1].children[0].name: 模块-1-3
        $.data[1].children[1].name: 模块-1-1
        $.data[1].children[2].name: 模块-1-2
  - name: 排序模块-不存在的父模块id
    url: http://localhost:8000/module/sort
    method: POST
    json:
      parent_id: 233
      module_ids: [1, 5]
    params: ''
    expect:
      status_code: 400
      assert_jsonpath:
        $.code: lt 0
        $.error: 父模块不存在
  - name: 排序模块-子模块不是指定父模块的子模块
    url: http://localhost:8000/module/sort
    method: POST
    json:
      module_ids: [2, 4, 3]
    params: ''
    expect:
      status_code: 400
      assert_jsonpath:
        $.code: lt 0
        $.error: 部分模块不是指定模块的子模块
  - name: 排序模块-缺少必备参数
    url: http://localhost:8000/module/sort
    method: POST
    json:
      parent_id: 1
    params: ''
    expect:
      status_code: 400
      assert_jsonpath:
        $.code: lt 0
        $.error: 缺少必备参数：module_ids
  # }}}
# vim: set foldmethod=marker foldlevel=0:

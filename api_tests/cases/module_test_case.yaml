module_cases:
  # 查询模块树 {{{
  - name: 查询模块树-没有模块
    sql_file: empty_module_tree.sql
    url: http://localhost:8000/module/tree
    method: GET
    json: {}
    params: ''
    expect:
      status_code: 200
      assert_jsonpath:
        $.data: []
    validate_schema: module_tree.yaml
  - name: 查询模块树-正常查询
    sql_file: normal_module_tree.sql
    url: http://localhost:8000/module/tree
    method: GET
    json: {}
    params: ''
    expect:
      status_code: 200
      assert_jsonpath:
        len:$.data: 1
        $.data[0].name: 系统管理
        $.data[0].children[0].name: 组织架构
        $.data[0].children[0].children[0].name: 部门管理
        $.data[0].children[0].children[1].name: 用户管理
        $.data[0].children[1].name: 权限管理
        $.data[0].children[1].children[0].name: 角色管理
        $.data[0].children[1].children[1].name: 权限分配
    validate_schema: module_tree.yaml
  - name: 查询模块树-多个根节点
    sql_file: multi_root_module_tree.sql
    url: http://localhost:8000/module/tree
    method: GET
    json: {}
    params: ''
    expect:
      status_code: 200
      assert_jsonpath:
        len:$.data: 3
        len:$.data[0].children: 2
        len:$.data[1].children: 1
        len:$.data[2].children: 1
    validate_schema: module_tree.yaml
  - name: 查询模块树-软删除数据不应被展示
    sql_file: have_deleted_data_module_tree.sql
    url: http://localhost:8000/module/tree
    method: GET
    json: {}
    params: ''
    expect:
      status_code: 200
      assert_jsonpath:
        len:$.data[0].children: 2 # 三个数据，软删除一个
    validate_schema: module_tree.yaml
  - name: 查询模块树-有关联的功能
    sql_file: module_tree_with_action.sql
    url: http://localhost:8000/module/tree
    method: GET
    json: {}
    params: ''
    expect:
      status_code: 200
      assert_jsonpath:
        len:$.data[0].children[0].children[0].actions: 6
        len:$.data[0].children[0].children[1].actions: 5
        len:$.data[0].children[1].children[0].actions: 5
        len:$.data[0].children[0].children[0].priorities: 4
        len:$.data[0].children[0].children[1].priorities: 4
        len:$.data[0].children[1].children[0].priorities: 4
    validate_schema: module_tree.yaml
  # }}}
  # 删除模块 {{{
  - name: 删除模块-不存在的数据
    sql_file: module_to_delete.sql
    url: http://localhost:8000/module/233
    method: DELETE
    json: {}
    params: version=0
    expect:
      status_code: 204
  - name: 删除模块-软删除的数据
    url: http://localhost:8000/module/1
    method: DELETE
    json: {}
    params: version=0
    expect:
      status_code: 204
  - name: 删除模块-有子模块的模块
    url: http://localhost:8000/module/2
    method: DELETE
    json: {}
    params: version=0
    expect:
      status_code: 400
      assert_jsonpath:
        $.code: lt 0
        $.error: 指定模块包含子模块
  - name: 删除模块-有功能的模块(功能均未被使用)
    url: http://localhost:8000/module/4
    method: DELETE
    json: {}
    params: version=0
    expect:
      status_code: 204
  - name: 删除模块-功能被分配了权限
    url: http://localhost:8000/module/5
    method: DELETE
    json: {}
    params: version=0
    expect:
      status_code: 400
      assert_jsonpath:
        $.code: lt 0
        $.error: 功能已被使用
  - name: 删除模块-功能被菜单使用
    url: http://localhost:8000/module/6
    method: DELETE
    json: {}
    params: version=0
    expect:
      status_code: 400
      assert_jsonpath:
        $.code: lt 0
        $.error: 功能已被使用
  # }}}
  # 新增模块 {{{
  - name: 新增模块-正常新增
    sql_file: module_to_create.sql
    url: http://localhost:8000/module
    method: POST
    json:
      name: 模块-1
    params: ''
    expect:
      status_code: 201
  - name: 新增模块-设置描述
    url: http://localhost:8000/module
    method: POST
    json:
      name: 模块-2
      description: 模块-2的描述
    params: ''
    expect:
      status_code: 201
  - name: 新增模块-设置父模块
    url: http://localhost:8000/module
    method: POST
    json:
      name: 模块-1-1
      parent_id: 1
    params: ''
    expect:
      status_code: 201
  - name: 新增模块-不同父部门的name可重复
    url: http://localhost:8000/module
    method: POST
    json:
      name: 模块-1
      parent_id: 2
    params: ''
    expect:
      status_code: 201
  - name: 新增模块-name冲突
    url: http://localhost:8000/module
    method: POST
    json:
      name: 模块-1
    params: ''
    expect:
      status_code: 400
      assert_jsonpath:
        $.code: lt 0
        $.error: 模块名称冲突
  - name: 新增模块-父模块不存在
    url: http://localhost:8000/module
    method: POST
    json:
      name: 模块-233
      parent_id: 233
    params: ''
    expect:
      status_code: 400
      assert_jsonpath:
        $.code: lt 0
        $.error: 指定的模块id不存在
  - name: 新增模块-数据检查
    url: http://localhost:8000/module/tree
    method: GET
    json: {}
    params: ''
    expect:
      status_code: 200
      assert_jsonpath:
        len:$.data: 4 # 2个自带2个新增
        $.data[1].children[0].name: 模块-1 # 与下一条不平级，可有重复的名称
        $.data[2].name: 模块-1 # 新增的
        $.data[3].name: 模块-2 # 新增的
  # }}}
  # 更新模块 {{{
  - name: 更新模块-未传递参数
    sql_file: module_to_update.sql
    url: http://localhost:8000/module/1
    method: PATCH
    json: {}
    params: ''
    expect:
      status_code: 400
      assert_jsonpath:
        $.code: lt 0
        $.error: 请至少指定一个需要更新的字段
  - name: 更新模块-只修改name且与旧值相同
    url: http://localhost:8000/module/1
    method: PATCH
    json:
      name: 模块-1
      version: 0
    params: ''
    expect:
      status_code: 204
  - name: 更新模块-只修改name
    url: http://localhost:8000/module/1
    method: PATCH
    json:
      name: 新名称
      version: 0
    params: ''
    expect:
      status_code: 204
  - name: 更新模块-数据检查-1
    url: http://localhost:8000/module/tree
    method: GET
    json: {}
    params: ''
    expect:
      status_code: 200
      assert_jsonpath:
        $.data[0].name: 新名称
        $.data[0].description: 未修改的描述
  - name: 更新模块-清空描述
    url: http://localhost:8000/module/1
    method: PATCH
    json:
      description: null
      version: 1
    params: ''
    expect:
      status_code: 204
  - name: 更新模块-数据检查-2
    url: http://localhost:8000/module/tree
    method: GET
    json: {}
    params: ''
    expect:
      status_code: 200
      assert_jsonpath:
        $.data[0].name: 新名称
        len:$.data[0].description: 0
  # }}}
  # 排序模块 {{{
  - name: 排序模块-正常排序
    sql_file: module_to_sort.sql
    url: http://localhost:8000/module/sort
    method: POST
    json:
      parent_id: 1
      modules:
        - module_id: 3
          version: 0
        - module_id: 2
          version: 0
        - module_id: 4
          version: 0
    params: ''
    expect:
      status_code: 204
  - name: 排序模块-检查排序结果
    url: http://localhost:8000/module/tree
    method: GET
    json: {}
    params: ''
    expect:
      status_code: 200
      assert_jsonpath:
        len:$.data: 2
        $.data[0].children[0].name: 模块-1-2
        $.data[0].children[1].name: 模块-1-1
        $.data[0].children[2].name: 模块-1-3
  - name: 排序模块-排序根模块
    url: http://localhost:8000/module/sort
    method: POST
    json:
      modules:
        - module_id: 5
          version: 0
        - module_id: 1
          version: 0
    params: ''
    expect:
      status_code: 204
  - name: 排序模块-检查排序结果2
    url: http://localhost:8000/module/tree
    method: GET
    json: {}
    params: ''
    expect:
      status_code: 200
      assert_jsonpath:
        len:$.data: 2
        $.data[0].name: 模块-2
        $.data[1].name: 模块-1
  - name: 排序模块-不存在的父模块id
    url: http://localhost:8000/module/sort
    method: POST
    json:
      parent_id: 233
      modules:
        - module_id: 1
          version: 1
        - module_id: 5
          version: 1
    params: ''
    expect:
      status_code: 400
      assert_jsonpath:
        $.code: lt 0
        $.error: 父模块不存在
  - name: 排序模块-子模块不是指定父模块的子模块
    url: http://localhost:8000/module/sort
    method: POST
    json:
      modules:
        - module_id: 2
          version: 1
        - module_id: 4
          version: 0
        - module_id: 3
          version: 1
    params: ''
    expect:
      status_code: 400
      assert_jsonpath:
        $.code: lt 0
        $.error: 部分模块不是指定模块的子模块
  - name: 排序模块-缺少必备参数
    url: http://localhost:8000/module/sort
    method: POST
    json:
      parent_id: 1
    params: ''
    expect:
      status_code: 400
      assert_jsonpath:
        $.code: lt 0
        $.error: 缺少必备参数：modules
  # }}}
  # 更新功能及其优先级 {{{
  - name: 更新功能-不存在的模块id
    sql_file: action_to_update.sql
    url: http://localhost:8000/module/233/actions
    method: POST
    json:
      version: 0
      actions: []
      priorities: []
    params: ''
    expect:
      status_code: 400
      assert_jsonpath:
        $.code: lt 0
        $.error: 指定的模块id不存在
  - name: 更新功能-新增/更新/删除功能及新增/删除优先级
    url: http://localhost:8000/module/1/actions
    method: POST
    json:
      version: 0
      # id 为4的功能被删除
      actions:
        - action_id: 1
          name: 功能-1
          code: action-1
          has_data_permission: false
          sort_num: 0
        - action_id: 2
          name: 功能-2
          code: action-2
          has_data_permission: true
          sort_num: 1
        - action_id: 3
          name: 功能-3
          code: action-3
          has_data_permission: true
          sort_num: 2
        - action_id: 5
          name: 功能-5【更新】
          code: action-5(updated)
          has_data_permission: true
          sort_num: 3
          # 新增
        - action_id: 1786001127689
          name: 功能-6
          code: action-6
          has_data_permission: true
          sort_num: 4
      priorities:
        - high_id: 1
          low_id: 2
        - high_id: 2
          low_id: 3
        - high_id: 2
          low_id: 5
        - high_id: 5
          low_id: 1786001127689
    params: ''
    expect:
      status_code: 204
  - name: 更新功能-检查更新结果-1
    url: http://localhost:8000/module/tree
    method: GET
    json: {}
    params: ''
    expect:
      status_code: 200
      assert_jsonpath:
        len:$.data[0].actions: 5
        $.data[0].actions[3].name: 功能-5【更新】
        $.data[0].actions[3].code: action-5(updated)
        len:$.data[0].priorities: 4
        $.data[0].priorities[3].low_id: gt 0
    validate_schema: module_tree.yaml
  - name: 更新功能-priorities使用不存在的action_id
    url: http://localhost:8000/module/2/actions
    method: POST
    json:
      version: 0
      priorities:
        - high_id: 114
          low_id: 514
    params: ''
    expect:
      status_code: 400
      assert_jsonpath:
        $.code: lt 0
        $.error: actions为空时，priorities也应为空
  - name: 更新功能-priorities的优先级不满足actions中的排序条件
    url: http://localhost:8000/module/3/actions
    method: POST
    json:
      version: 0
      actions:
        - action_id: 6
          name: 功能-3-1
          code: action-3-1
          has_data_permission: false
          sort_num: 0
        - action_id: 7
          name: 功能-3-2
          code: action-3-2
          has_data_permission: false
          sort_num: 1
      priorities:
        - high_id: 7
          low_id: 6
    params: ''
    expect:
      status_code: 400
      assert_jsonpath:
        $.code: lt 0
        $.error: 权限优先级应该满足排序的条件
  - name: 更新功能-清空模块-1的功能
    url: http://localhost:8000/module/1/actions
    method: POST
    json:
      version: 1
    params: ''
    expect:
      status_code: 204
  - name: 更新功能-功能id不属于指定的模块
    url: http://localhost:8000/module/1/actions
    method: POST
    json:
      version: 2
      actions:
        - action_id: 6
          name: 功能-1
          code: action-1
          has_data_permission: false
          sort_num: 0
    params: ''
    expect:
      status_code: 400
      assert_jsonpath:
        $.code: lt 0
        $.error: 指定的功能id不属于指定的模块
  - name: 更新功能-功能id不存在
    url: http://localhost:8000/module/1/actions
    method: POST
    json:
      version: 2
      actions:
        - action_id: 233
          name: 功能-1
          code: action-1
          has_data_permission: false
          sort_num: 0
    params: ''
    expect:
      status_code: 400
      assert_jsonpath:
        $.code: lt 0
        $.error: 指定的功能id不存在
  # }}}
# vim: set foldmethod=marker foldlevel=0:

user_cases:
  # 分页查询用户（未充分测试） {{{
  - name: 分页查询用户-默认参数
    sql_file: user.sql
    url: http://localhost:8000/user
    method: GET
    json: {}
    params: ''
    expect:
      status_code: 200
      assert_jsonpath:
        $.data.page: 1
        $.data.page_size: 10
        $.data.total: 17
        len:$.data.list: 10
    validate_schema: user_paginated.yaml
  - name: 分页查询用户-带参查询1
    url: http://localhost:8000/user
    method: GET
    json: {}
    params: username=admin
    expect:
      status_code: 200
      assert_jsonpath:
        $.data.page: 1
        $.data.page_size: 10
        $.data.total: 4
        len:$.data.list: 4
    validate_schema: user_paginated.yaml
  - name: 分页查询用户-带参查询2
    url: http://localhost:8000/user
    method: GET
    json: {}
    params: nickname=-
    expect:
      status_code: 200
      assert_jsonpath:
        $.data.page: 1
        $.data.page_size: 10
        $.data.total: 10
        len:$.data.list: 10
    validate_schema: user_paginated.yaml
  - name: 分页查询用户-带参查询3
    url: http://localhost:8000/user
    method: GET
    json: {}
    params: sex=0&dept_id=8&phone_number=0000&email=temp&status=1
    expect:
      status_code: 200
      assert_jsonpath:
        $.data.page: 1
        $.data.page_size: 10
        $.data.total: 1
        len:$.data.list: 1
        $.data.list[0].username: guest_user
    validate_schema: user_paginated.yaml
  # }}}
  # 更新用户 {{{
  - name: 更新用户-不存在的用户id
    sql_file: user_to_update.sql
    url: http://localhost:8000/user/1
    method: PUT
    json: {}
    params: ''
    expect:
      status_code: 400
      assert_jsonpath:
        $.code: lt 0
        $.error: 用户不存在
  - name: 更新用户-软删除的用户id
    url: http://localhost:8000/user/2
    method: PUT
    json: {}
    params: ''
    expect:
      status_code: 400
      assert_jsonpath:
        $.code: lt 0
        $.error: 用户不存在
  - name: 更新用户-所有字段和旧值相同
    url: http://localhost:8000/user/3
    method: PUT
    json:
      nickname: 无更新测试用户
      phone_number: '18800000003'
      email: noupdate@test.com
    params: ''
    expect:
      status_code: 204
  - name: 更新用户-数据检查-1
    url: http://localhost:8000/user
    method: GET
    json: {}
    params: ''
    expect:
      status_code: 200
      assert_jsonpath:
        $.data.list[0].nickname: 无更新测试用户
        $.data.list[0].phone_number: '18800000003'
        $.data.list[0].email: noupdate@test.com
    validate_schema: user_paginated.yaml
  - name: 更新用户-除部门id和拥有角色id之外的其他字段
    url: http://localhost:8000/user/4
    method: PUT
    json:
      nickname: 新的管理员名称
      sex: 2
      phone_number: '18212345678'
      email: new_admin@example.com
      status: 1
    params: ''
    expect:
      status_code: 204
  - name: 更新用户-数据检查-2
    url: http://localhost:8000/user
    method: GET
    json: {}
    params: ''
    expect:
      status_code: 200
      assert_jsonpath:
        $.data.list[1].nickname: 新的管理员名称
        $.data.list[1].sex: 2
        $.data.list[1].phone_number: '18212345678'
        $.data.list[1].email: new_admin@example.com
        $.data.list[1].status: 1
    validate_schema: user_paginated.yaml
  - name: 更新用户-清空字段
    url: http://localhost:8000/user/5
    method: PUT
    json:
      phone_number: null
      email: null
    params: ''
    expect:
      status_code: 204
  - name: 更新用户-数据检查-3
    url: http://localhost:8000/user
    method: GET
    json: {}
    params: ''
    expect:
      status_code: 200
      assert_jsonpath:
        len:$.data.list[2]: 7 # user_id, username, nickname, avatar, sex, dept_id, status
    validate_schema: user_paginated.yaml
    # 更新部门 {{{
  - name: 更新用户-不存在的部门id
    url: http://localhost:8000/user/6
    method: PUT
    json:
      dept_id: 233
    params: ''
    expect:
      status_code: 400
      assert_jsonpath:
        $.code: lt 0
        $.error: 指定的部门id不存在
  - name: 更新用户-软删除的部门id
    url: http://localhost:8000/user/6
    method: PUT
    json:
      dept_id: 2
    params: ''
    expect:
      status_code: 400
      assert_jsonpath:
        $.code: lt 0
        $.error: 指定的部门id不存在
  - name: 更新用户-数据检查-4-不应该更新
    url: http://localhost:8000/user
    method: GET
    json: {}
    params: ''
    expect:
      status_code: 200
      assert_jsonpath:
        $.data.list[3].dept_id: 1
    validate_schema: user_paginated.yaml
  - name: 更新用户-正常更新
    url: http://localhost:8000/user/7
    method: PUT
    json:
      dept_id: 3
    params: ''
    expect:
      status_code: 204
  - name: 更新用户-数据检查-5-正常更新
    url: http://localhost:8000/user
    method: GET
    json: {}
    params: ''
    expect:
      status_code: 200
      assert_jsonpath:
        $.data.list[4].dept_id: 3
    validate_schema: user_paginated.yaml
  - name: 更新用户-白名单到其他
    url: http://localhost:8000/user/8
    method: PUT
    json:
      dept_id: 3
    params: ''
    expect:
      status_code: 400
      assert_jsonpath:
        $.code: lt 0
        $.error: 指定部门不在角色的白名单中
  - name: 更新用户-数据检查-6-更新失败
    url: http://localhost:8000/user
    method: GET
    json: {}
    params: ''
    expect:
      status_code: 200
      assert_jsonpath:
        $.data.list[5].dept_id: 1
  - name: 更新用户-其他到黑名单
    url: http://localhost:8000/user/9
    method: PUT
    json:
      dept_id: 3
    params: ''
    expect:
      status_code: 400
      assert_jsonpath:
        $.code: lt 0
        $.error: 指定部门在角色的黑名单中
  - name: 更新用户-数据检查-6-更新失败
    url: http://localhost:8000/user
    method: GET
    json: {}
    params: ''
    expect:
      status_code: 200
      assert_jsonpath:
        $.data.list[6].dept_id: 1
  - name: 更新用户-角色数量限制
    url: http://localhost:8000/user/11
    method: PUT
    json:
      dept_id: 3
    params: ''
    expect:
      status_code: 400
      assert_jsonpath:
        $.code: lt 0
        $.error: 使用当前角色的用户数量已达限制
  - name: 更新用户-数据检查-7-更新失败
    url: http://localhost:8000/user
    method: GET
    json: {}
    params: ''
    expect:
      status_code: 200
      assert_jsonpath:
        $.data.list[8].dept_id: 1
    # }}}
    # 更新角色 {{{
  - name: 更新用户-不存在的角色id
    url: http://localhost:8000/user/12
    method: PUT
    json:
      role_ids: [233]
    params: ''
    expect:
      status_code: 400
      assert_jsonpath:
        $.code: lt 0
        $.error: 部分角色不存在
  - name: 更新用户-软删除的角色id
    url: http://localhost:8000/user/12
    method: PUT
    json:
      role_ids: [4]
    params: ''
    expect:
      status_code: 400
      assert_jsonpath:
        $.code: lt 0
        $.error: 部分角色不存在
  - name: 更新用户-正常分配普通角色
    url: http://localhost:8000/user/13
    method: PUT
    json:
      role_ids: [5]
    params: ''
    expect:
      status_code: 204
  - name: 更新用户-清空角色
    url: http://localhost:8000/user/14
    method: PUT
    json:
      role_ids: []
    params: ''
    expect:
      status_code: 204
  - name: 更新用户-分配白名单但不在指定部门的角色
    url: http://localhost:8000/user/15
    method: PUT
    json:
      role_ids: [1]
    params: ''
    expect:
      status_code: 400
      assert_jsonpath:
        $.code: lt 0
        $.error: 指定部门不在角色的白名单中
  - name: 更新用户-分配黑名单且在指定部门的角色
    url: http://localhost:8000/user/16
    method: PUT
    json:
      role_ids: [2]
    params: ''
    expect:
      status_code: 400
      assert_jsonpath:
        $.code: lt 0
        $.error: 指定部门在角色的黑名单中
  - name: 更新用户-分配角色，但超出了每部门数量限制
    url: http://localhost:8000/user/17
    method: PUT
    json:
      role_ids: [3]
    params: ''
    expect:
      status_code: 400
      assert_jsonpath:
        $.code: lt 0
        $.error: 使用当前角色的用户数量已达限制
  - name: 更新用户-分配角色，但超出了总数量数量限制
    url: http://localhost:8000/user/19
    method: PUT
    json:
      role_ids: [6]
    params: ''
    expect:
      status_code: 400
      assert_jsonpath:
        $.code: lt 0
        $.error: 使用当前角色的用户数量已达限制
    # }}}
    # 同时更新部门和角色 {{{
  - name: 更新用户-白名单->白名单
    url: http://localhost:8000/user/20
    method: PUT
    json:
      dept_id: 3
      role_ids: [7]
    params: ''
    expect:
      status_code: 204
  - name: 更新用户-白名单->白名单(超出数量限制)
    url: http://localhost:8000/user/22
    method: PUT
    json:
      dept_id: 4
      role_ids: [8]
    params: ''
    expect:
      status_code: 400
      assert_jsonpath:
        $.code: lt 0
        $.error: 使用当前角色的用户数量已达限制
  - name: 更新用户-白名单->普通
    url: http://localhost:8000/user/23
    method: PUT
    json:
      dept_id: 3
      role_ids: [5]
    params: ''
    expect:
      status_code: 204
  - name: 更新用户-白名单->黑名单
    url: http://localhost:8000/user/24
    method: PUT
    json:

auth_cases:
  # 登录接口 {{{
  - name: 登录接口-缺少用户名
    sql_file: auth_to_login.sql
    url: http://localhost:8000/login
    method: POST
    need_token: False
    json:
      password: '123456'
    params: ''
    expect:
      status_code: 400
      assert_jsonpath:
        $.code: lt 0
        $.error: 缺少必备参数：username
  - name: 登录接口-缺少密码
    url: http://localhost:8000/login
    method: POST
    need_token: False
    json:
      username: admin123
    params: ''
    expect:
      status_code: 400
      assert_jsonpath:
        $.code: lt 0
        $.error: 缺少必备参数：password
  - name: 登录接口-用户名长度过短(5)
    url: http://localhost:8000/login
    method: POST
    need_token: False
    json:
      username: admin
      password: '123456'
    params: ''
    expect:
      status_code: 400
      assert_jsonpath:
        $.code: lt 0
        $.error: username参数长度过短
  - name: 登录接口-用户名长度过长(21)
    url: http://localhost:8000/login
    method: POST
    need_token: False
    json:
      username: abcdefghijklmnopqrstu
      password: '123456'
    params: ''
    expect:
      status_code: 400
      assert_jsonpath:
        $.code: lt 0
        $.error: username参数长度过长
  - name: 登录接口-密码长度过短(5)
    url: http://localhost:8000/login
    method: POST
    need_token: False
    json:
      username: admin123
      password: '12345'
    params: ''
    expect:
      status_code: 400
      assert_jsonpath:
        $.code: lt 0
        $.error: password参数长度过短
  - name: 登录接口-密码长度过长(21)
    url: http://localhost:8000/login
    method: POST
    need_token: False
    json:
      username: admin123
      password: abcdefghijklmnopqrstu
    params: ''
    expect:
      status_code: 400
      assert_jsonpath:
        $.code: lt 0
        $.error: password参数长度过长
  - name: 登录接口-缺少验证码
    url: http://localhost:8000/login
    method: POST
    need_token: False
    json:
      username: admin123
      password: '123456'
    params: ''
    expect:
      status_code: 400
      assert_jsonpath:
        $.code: lt 0
        $.error: 缺少必备参数：captchaId
    validate_schema: login_response.yaml
  - name: 登录接口-有验证码id，但是没有验证码
    url: http://localhost:8000/login
    method: POST
    need_token: False
    need_captcha: True
    json:
      username: admin123
      password: '123456'
      captchaId: ${captcha_id}
    params: ''
    expect:
      status_code: 400
      assert_jsonpath:
        $.code: lt 0
        $.error: 缺少必备参数：captcha
    validate_schema: login_response.yaml
  - name: 登录接口-正常登录（为后续接口做准备）
    url: http://localhost:8000/login
    method: POST
    need_token: False
    need_captcha: True
    json:
      username: admin123
      password: '123456'
      captchaId: ${captcha_id}
      captcha: ${captcha_text}
    params: ''
    expect:
      status_code: 200
      assert_jsonpath:
        $.data.user_info.user_id: 1
    validate_schema: login_response.yaml
    extract:
      token: $.data.token
  - name: 登录接口-已经被使用的验证码
    url: http://localhost:8000/login
    method: POST
    need_token: False
    json:
      username: admin123
      password: '123456'
      captchaId: ${captcha_id}
      captcha: ${captcha_text}
    params: ''
    expect:
      status_code: 400
      assert_jsonpath:
        $.code: lt 0
        $.error: 验证码已失效
    validate_schema: login_response.yaml
  # }}}
# vim: set foldmethod=marker foldlevel=0:

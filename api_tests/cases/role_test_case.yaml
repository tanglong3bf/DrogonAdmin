role_cases:
  # 分页查询角色 {{{
  - name: 分页查询角色-正常查询
    sql_file: role.sql
    url: http://localhost:8000/role
    method: GET
    json: {}
    params: 'page=1&page_size=10'
    expect:
      status_code: 200
      assert_jsonpath:
        $.data.page: 1
        $.data.page_size: 10
        $.data.total: 101
